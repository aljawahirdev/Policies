<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الوثائق والسياسات | جمعية الجواهر بقمار</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;700&display=swap" rel="stylesheet">

<style>

body{
  font-family:"Noto Kufi Arabic",sans-serif;
  margin:0;
  background:#f5f8f9;
  color:#222;
}

.container{
  width:min(1100px,90%);
  margin:auto;
}

/* HEADER */
header{
  background:#1F7E7D;
  color:white;
  padding:20px 0;
}

header .container{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* HERO */
.hero{
  padding:50px 0;
  text-align:center;
}

.hero h1{
  color:#1F7E7D;
  font-size:40px;
}

.hero p{
  color:#666;
  line-height:2;
}

/* DOCS */
.docs{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:30px 0 80px;
}

.card{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  transition:.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.icon{
  font-size:30px;
}

.card h3{
  color:#1F7E7D;
}

.card p{
  color:#666;
  line-height:1.8;
}

/* BUTTON */
.btn{
  display:block;
  text-align:center;
  background:#299E9D;
  color:white;
  padding:10px;
  border-radius:10px;
  text-decoration:none;
  margin-top:15px;
}

/* LOADING */
.loading{
  text-align:center;
  padding:40px;
  color:#666;
}

</style>

</head>

<body>

<!-- HEADER -->
<header>
  <div class="container">
    <h2>جمعية الجواهر بقمار</h2>
    <span>الوثائق والسياسات</span>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="container">
    <h1>منصة الوثائق الرسمية</h1>
    <p>هنا يتم عرض جميع الوثائق والسياسات الخاصة بالجمعية بشكل مباشر</p>
  </div>
</section>

<!-- DOCS -->
<section class="container">

<div id="docs" class="docs">
  <div class="loading">جاري تحميل الوثائق...</div>
</div>

</section>

<script>

//////////////////////////////////////////////////////
// 🔴 غيّر الرابط هنا فقط 👇
//////////////////////////////////////////////////////

const API_URL = "https://script.google.com/macros/s/AKfycbwDIFv8MnN1PQM6RcKXGeVaC9YflHRGDeo8m1pzvU5pRV9_a3t5Fq3JHzOwgtj-azy3Rg/exec";

//////////////////////////////////////////////////////

async function loadDocs() {

  try {

    const res = await fetch(API_URL);
    const docs = await res.json();

    renderDocs(docs);

  } catch (err) {

    document.getElementById("docs").innerHTML =
      "<div class='loading'>حدث خطأ في تحميل البيانات</div>";

  }
}

function renderDocs(docs){

  const container = document.getElementById("docs");
  container.innerHTML = "";

  if(!docs || docs.length === 0){
    container.innerHTML = "<div class='loading'>لا توجد وثائق</div>";
    return;
  }

  docs.forEach(doc => {

    container.innerHTML += `
      <div class="card">

        <div class="icon">${doc.icon || "📄"}</div>

        <h3>${doc.title || ""}</h3>

        <p>${doc.desc || ""}</p>

        <a class="btn" href="${doc.driveLink}" target="_blank">
          فتح الوثيقة
        </a>

      </div>
    `;
  });

}

loadDocs();

</script>

</body>
</html>
